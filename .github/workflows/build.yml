name: Build

on:
  push:
    tags: ["v*"]  # a version tag builds the app and publishes it as a GitHub release
  workflow_dispatch:  # manual build from the Actions tab, kept as a workflow artifact

env:
  # yt-dlp's ffmpeg builds include fixes for yt-dlp; "shared" puts common code in DLLs, much smaller than static
  FFMPEG_URL: https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write  # to create the release
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked

      - name: Download ffmpeg into bin/
        shell: pwsh
        run: |
          Invoke-WebRequest $env:FFMPEG_URL -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          New-Item -ItemType Directory -Force bin | Out-Null
          Copy-Item ffmpeg/*/bin/* bin/ -Exclude ffplay.exe
          Copy-Item ffmpeg/*/LICENSE.txt bin/FFMPEG-LICENSE.txt

      - name: Build
        run: uv run pyinstaller shuvi.spec --noconfirm

      - name: Zip
        shell: pwsh
        run: |
          Copy-Item bin/FFMPEG-LICENSE.txt dist/Shuvi/
          Compress-Archive dist/Shuvi Shuvi-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Shuvi-windows
          path: Shuvi-windows.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Shuvi-windows.zip

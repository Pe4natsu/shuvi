[project]
name = "shuvi"
version = "0.1.0"
description = "App to download Youtube videos"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.2.4",
    "yt-dlp[default, deno]>=2026.10.21,<2027",
]


[project.scripts]
shuvi-playlist = "shuvi.core.playlists:run"
shuvi-video = "shuvi.core.videos:run"

[dependency-groups]
dev = [
    "ruff>=0.14.0",
    "pyinstaller>=6.10",
]

[build-system]
requires      = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

